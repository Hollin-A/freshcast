# Throwaway Postgres for the API's e2e tests (pnpm --filter @freshcast/api e2e:up).
# Used locally and in CI. A different port from the web app's e2e database
# (apps/web/e2e/compose.yml), so both can run at once.

name: freshcast-api-e2e

services:
  # The global setup migrates it; each test file empties it between tests.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: freshcast_api_e2e
    ports:
      - "54330:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # Over TCP: the image's init server only listens on the socket, so a
    # socket check passes before the real server is up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U e2e -d freshcast_api_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15
