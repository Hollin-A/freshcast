version: 1
applications:
  # Monorepo: appRoot must match the AMPLIFY_MONOREPO_APP_ROOT environment
  # variable set in the Amplify console (Hosting > Environment variables).
  - appRoot: apps/web
    frontend:
      # Install and build from the repo root so the pnpm workspace installs together.
      buildPath: /
      phases:
        preBuild:
          commands:
            # pnpm 11 (pinned in package.json "packageManager") needs Node 22.22+ or 24.15+.
            - nvm install 24
            - nvm use 24
            - corepack enable
            # Store inside the build dir so Amplify can cache it between builds.
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - nvm use 24
            # Surface Amplify Console env vars into the web app's .env.production so they
            # reach the SSR runtime. See docs/adr/017-next-config-no-env.md.
            # Server-only vars (no NEXT_PUBLIC_ prefix → never inlined into the client bundle by Next.js).
            - |
              env | grep -E '^(DATABASE_URL|AUTH_SECRET|AUTH_URL|APP_AWS_REGION|APP_AWS_ACCESS_KEY_ID|APP_AWS_SECRET_ACCESS_KEY|APP_AWS_SESSION_TOKEN|SES_FROM_EMAIL|S3_RECEIPTS_BUCKET)=' >> apps/web/.env.production || true
            # Public vars (NEXT_PUBLIC_*) — intentionally inlined into the client bundle.
            - env | grep -E '^NEXT_PUBLIC_' >> apps/web/.env.production || true
            - pnpm exec prisma generate
            - pnpm turbo run build --filter=@freshcast/web
      artifacts:
        # Relative to buildPath (the repo root).
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - .pnpm-store/**/*
          - apps/web/.next/cache/**/*
