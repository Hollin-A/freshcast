name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Sorts a pull request's changed files into areas so each job below runs
  # only when its area changed. A skipped job counts as passing for a
  # required check, which is why the filtering happens here and not through
  # `paths` on the trigger (a workflow that never starts leaves its required
  # checks waiting forever). Pushes to main skip this job and run everything.
  #
  # Every job below runs when this job didn't succeed, so a broken filter
  # fails closed. `common` matches any non-docs file outside the areas, so a
  # file nobody sorted runs every job.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      infra: ${{ steps.filter.outputs.infra }}
      common: ${{ steps.filter.outputs.common }}

    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A file matches a filter when it matches an include pattern and
          # none of the "!" excludes.
          predicate-quantifier: some-with-excludes
          filters: |
            # Anything CI can test: all but docs and editor or agent config.
            # The PR template is code here, since check-pr-body's tests read it.
            code:
              - '**'
              - '!*.md'
              - '!apps/**/*.md'
              - '!packages/**/*.md'
              - '!infra/**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.claude/**'
              - '!.vscode/**'
            web:
              - 'apps/web/**'
              - '!apps/web/**/*.md'
            api:
              - 'apps/api/**'
              - '!apps/api/**/*.md'
            infra:
              - 'infra/**'
              - '!infra/**/*.md'
            # What every job depends on: packages/*, dependencies, Turborepo
            # and CI config, and any file not sorted into an area.
            common:
              - '**'
              - '!*.md'
              - '!apps/**/*.md'
              - '!packages/**/*.md'
              - '!infra/**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.claude/**'
              - '!.vscode/**'
              - '!apps/web/**'
              - '!apps/api/**'
              - '!infra/**'
              - '!scripts/**'
              - '!.github/pull_request_template.md'
              - '!.github/ui-paths'
              - '!.github/CODEOWNERS'

  # Lint, type check, unit tests, guard script tests and build: any change
  # but docs.
  check:
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each script runs the task in every workspace package through Turborepo.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Scope guard tests
        run: node --test scripts/check-ui-scope.test.mjs

      - name: PR body check tests
        run: node --test scripts/check-pr-body.test.mjs

      # Catches build-only failures before Amplify does. Placeholder values
      # satisfy the env checks that run when routes load; the build never
      # connects to the database.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-build-only
          AUTH_URL: http://localhost:3000

  # Runs every story as a test in Chromium, once per Appearance (light and
  # dark). Separate from `check` so the browser download stays out of it.
  storybook:
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.web == 'true' || needs.changes.outputs.common == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @freshcast/web exec playwright install --with-deps chromium

      # A cached browser still needs its system libraries.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @freshcast/web exec playwright install-deps chromium

      - name: Story tests
        run: pnpm test:storybook

  # Playwright journeys and screenshot baselines (apps/web/e2e). The App runs
  # on the runner against a throwaway Postgres; Chromium runs in Playwright's
  # Docker image, the same one used locally, so screenshots match. MSW
  # answers the browser's API calls, so apps/api changes don't affect it.
  e2e:
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.web == 'true' || needs.changes.outputs.common == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start database and browser
        run: pnpm --filter @freshcast/web e2e:up

      # Same values as E2E_APP_ENV in apps/web/e2e/env.ts.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://e2e:e2e@localhost:54329/freshcast_e2e
          AUTH_SECRET: e2e-only-secret
          AUTH_URL: http://localhost:3100
          NEXT_PUBLIC_SENTRY_DSN: ""

      - name: Journeys
        run: pnpm --filter @freshcast/web test:e2e

      # Holds the expected, actual and diff images for a failed screenshot.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 7

  # HTTP-level tests of the NestJS API (apps/api/test) against a throwaway
  # Postgres: the real AppModule, guards and pipeline, with session cookies
  # made the way the App's Auth.js makes them.
  api-e2e:
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.api == 'true' || needs.changes.outputs.common == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start database
        run: pnpm --filter @freshcast/api e2e:up

      # Through Turborepo so @freshcast/db and @freshcast/shared are built first.
      - name: API e2e tests
        run: pnpm exec turbo run test:e2e --filter=@freshcast/api

  # Builds the API's production image (apps/api/Dockerfile) and starts it,
  # so a broken Dockerfile, a missing package or an image that won't start
  # fails here rather than in a deploy. Nothing is pushed. Runs on an ARM64
  # runner because Fargate runs the image on ARM64 (ADR-021), so there's no
  # emulation.
  api-image:
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.api == 'true' || needs.changes.outputs.common == 'true')
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: freshcast-api:ci
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image
          # Rebuild the runtime stage every time, so `apk upgrade` picks up
          # Alpine's latest security fixes instead of a cached layer. The
          # prune and build stages stay cached.
          no-cache-filters: runtime

      # The API checks the database before it listens, so it needs a
      # Postgres. Unmigrated is enough: the readiness check runs SELECT 1.
      - name: Start database
        run: docker compose -f apps/api/test/compose.yml up -d --wait

      - name: Smoke test
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://e2e:e2e@localhost:54330/freshcast_api_e2e \
            -e AUTH_SECRET=smoke-test-only-secret-at-least-32-chars \
            freshcast-api:ci
          for _ in $(seq 1 30); do
            curl -sf localhost:4000/health/live && break
            sleep 1
          done
          curl -sf localhost:4000/health/ready

      - name: Container logs
        if: failure()
        run: docker logs api

  # Shows what a pull request would change in AWS: synthesizes the CDK app
  # (infra/) and diffs it against the deployed stacks. Signs in through
  # GitHub OIDC as a role that can only read (FreshcastAccount stack), so no
  # AWS keys are stored here. Synth runs before sign-in, so lookups can't
  # call AWS: their results must be committed in infra/cdk.context.json.
  # Pull requests only; `deploy-api` below deploys on main.
  #
  # GitHub gives no OIDC token to pull requests from forks, so those skip
  # the job (a skipped required check passes) instead of failing to sign in.
  infra-diff:
    needs: changes
    if: >-
      github.event_name == 'pull_request' && !cancelled()
      && github.event.pull_request.head.repo.full_name == github.repository
      && (needs.changes.result != 'success'
      || needs.changes.outputs.infra == 'true' || needs.changes.outputs.common == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs cdk-nag and CloudFormation validation; writes infra/cdk.out.
      - name: cdk synth
        run: pnpm --filter @freshcast/infra synth
        env:
          # No credentials yet: skip the slow EC2 metadata probe.
          AWS_EC2_METADATA_DISABLED: "true"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CDK_DIFF_ROLE_ARN }}
          aws-region: ap-southeast-2

      # Diffs the assembly from the synth step. The output goes to the log
      # and the job summary.
      - name: cdk diff
        run: |
          set -o pipefail
          pnpm --filter @freshcast/infra diff --app cdk.out 2>&1 | tee "$RUNNER_TEMP/cdk-diff.txt"
          {
            echo '## cdk diff'
            echo '```'
            cat "$RUNNER_TEMP/cdk-diff.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Decides whether a push to main deploys the API: a change to the API, the
  # packages it builds from, its stack (infra/), dependencies, or this
  # workflow. Docs-only and App-only pushes don't deploy. The `changes` job
  # above runs on pull requests only, so the push to main has its own filter.
  # It compares the push with the commit before it, so a merged pull request
  # counts as a whole.
  deploy-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'infra/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - '!**/*.md'

  # Deploys the API to production on a push to main (#34, ADR-020 D5):
  # pushes the image tagged with the commit SHA, tags it `production-<sha>`
  # so the ECR lifecycle rule keeps it, runs `cdk deploy FreshcastApi`, then
  # checks the new version is serving. Signs in through GitHub OIDC as the
  # deploy role, which trusts only the `production` GitHub environment, so
  # no AWS keys are stored here.
  #
  # Runs only after the API's tests and image smoke test pass. Their `needs`
  # chain includes `changes`, which is skipped on pushes, so the condition
  # checks each result instead of relying on the implicit success().
  #
  # Skipped until the AWS_DEPLOY_ROLE_ARN repository variable is set, which
  # happens after FreshcastAccount is deployed by hand (CONTRIBUTING).
  deploy-api:
    needs: [deploy-changes, check, api-e2e, api-image]
    if: >-
      !cancelled() && vars.AWS_DEPLOY_ROLE_ARN != ''
      && needs.deploy-changes.outputs.api == 'true'
      && needs.check.result == 'success'
      && needs.api-e2e.result == 'success'
      && needs.api-image.result == 'success'
    # The image runs on ARM64 Fargate (ADR-021), so build it natively.
    runs-on: ubuntu-24.04-arm
    environment:
      name: production
      url: https://api.freshcast.site/health/live
    # One deploy at a time: two CloudFormation updates of one stack fail.
    # A newer deploy waits rather than stopping one halfway. The group holds
    # one waiting run, so an older waiting run is cancelled by a newer one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-2
      REPOSITORY: freshcast-api
      SHA: ${{ github.sha }}
      API_URL: https://api.freshcast.site

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Tags are immutable, so a re-run of the same commit skips the push.
      - name: Check for an existing image
        id: image
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$SHA" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.exists == 'false'

      # Reuses the layers `api-image` built and smoke-tested in this run (same
      # cache scope). Unlike that job it doesn't force a fresh runtime stage,
      # so the pushed image is the one that was tested. Provenance and SBOM
      # attestations are off so ECR gets one plain image manifest.
      - name: Build and push image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ env.SHA }}
          cache-from: type=gha,scope=api-image

      # The ECR lifecycle rule keeps the last 10 images with this tag, so the
      # running image and its rollbacks can't expire (ARCHITECTURE §12.4).
      - name: Tag the image production-<sha>
        run: |
          tag="production-$SHA"
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "$tag already exists"
            exit 0
          fi
          get() { aws ecr batch-get-image --repository-name "$REPOSITORY" --image-ids imageTag="$SHA" --query "images[0].$1" --output text; }
          aws ecr put-image --repository-name "$REPOSITORY" --image-tag "$tag" \
            --image-manifest "$(get imageManifest)" \
            --image-manifest-media-type "$(get imageManifestMediaType)" >/dev/null

      # Runs for different pushes can reach this job out of order, so a slow
      # run for an older push could overwrite a newer deploy, and the health
      # check below wouldn't notice. Deploy only while this commit is still
      # the tip of main. A newer push's deploy waits in the concurrency group,
      # so it always runs after this one.
      - name: Check this commit is the tip of main
        id: tip
        run: |
          tip=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ -z "$tip" ]; then
            echo "::error::Couldn't read the tip of main"
            exit 1
          fi
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the deploy: main is at $tip, not $SHA"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.tip.outputs.current == 'true'

      - uses: actions/setup-node@v4
        if: steps.tip.outputs.current == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.tip.outputs.current == 'true'

      # CloudFormation waits for the ECS service to reach a steady state, and
      # the deployment circuit breaker rolls back tasks that can't start, so
      # a failed rollout fails this step. --exclusively keeps FreshcastShared
      # and FreshcastAccount out: they are deployed by hand.
      - name: cdk deploy FreshcastApi
        if: steps.tip.outputs.current == 'true'
        run: >-
          pnpm --filter @freshcast/infra cdk deploy FreshcastApi
          --exclusively --require-approval never
          --parameters ImageTag="$SHA"

      # `/health/live` must report this commit and `/health/ready` must be
      # 200 (ADR-023 §7). Retries cover the ALB finishing the switch to the
      # new task.
      - name: Check the new version is serving
        if: steps.tip.outputs.current == 'true'
        run: |
          for attempt in $(seq 1 20); do
            version=$(curl -sf "$API_URL/health/live" | jq -r .version || true)
            ready=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/health/ready" || true)
            echo "attempt $attempt: version=$version ready=$ready"
            if [ "$version" = "$SHA" ] && [ "$ready" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::$API_URL is not serving $SHA with /health/ready 200"
          exit 1

  # ui/* branches may only change the frontend presentation files listed in
  # .github/ui-paths. Other branches pass straight through, so the job can
  # stay a required check.
  scope-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Runs main's copy of the script, which reads main's ui-paths, so a
      # ui/* branch can't loosen the rules that judge it.
      - name: Check ui/ branch scope
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          git show "$BASE:scripts/check-ui-scope.mjs" > "$RUNNER_TEMP/check-ui-scope.mjs"
          node "$RUNNER_TEMP/check-ui-scope.mjs" --base "$BASE"
