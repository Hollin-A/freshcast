name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each script runs the task in every workspace package through Turborepo.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Catches build-only failures before Amplify does. Placeholder values
      # satisfy the env checks that run when routes load; the build never
      # connects to the database.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-build-only
          AUTH_URL: http://localhost:3000

  # ui/* branches may only change the frontend presentation files listed in
  # .github/ui-paths. Other branches pass straight through, so the job can
  # stay a required check.
  scope-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check ui/ branch scope
        run: node scripts/check-ui-scope.mjs --base origin/${{ github.base_ref || 'main' }}
