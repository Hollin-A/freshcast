name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each script runs the task in every workspace package through Turborepo.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Scope guard tests
        run: node --test scripts/check-ui-scope.test.mjs

      # Catches build-only failures before Amplify does. Placeholder values
      # satisfy the env checks that run when routes load; the build never
      # connects to the database.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-build-only
          AUTH_URL: http://localhost:3000

  # Runs every story as a test in Chromium, once per Appearance (light and
  # dark). Separate from `check` so the browser download stays out of it.
  storybook:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @freshcast/web exec playwright install --with-deps chromium

      # A cached browser still needs its system libraries.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @freshcast/web exec playwright install-deps chromium

      - name: Story tests
        run: pnpm test:storybook

  # Playwright journeys and screenshot baselines (apps/web/e2e). The App runs
  # on the runner against a throwaway Postgres; Chromium runs in Playwright's
  # Docker image, the same one used locally, so screenshots match.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start database and browser
        run: pnpm --filter @freshcast/web e2e:up

      # Same values as E2E_APP_ENV in apps/web/e2e/env.ts.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://e2e:e2e@localhost:54329/freshcast_e2e
          AUTH_SECRET: e2e-only-secret
          AUTH_URL: http://localhost:3100
          NEXT_PUBLIC_SENTRY_DSN: ""

      - name: Journeys
        run: pnpm --filter @freshcast/web test:e2e

      # Holds the expected, actual and diff images for a failed screenshot.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 7

  # ui/* branches may only change the frontend presentation files listed in
  # .github/ui-paths. Other branches pass straight through, so the job can
  # stay a required check.
  scope-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Runs main's copy of the script, which reads main's ui-paths, so a
      # ui/* branch can't loosen the rules that judge it.
      - name: Check ui/ branch scope
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          git show "$BASE:scripts/check-ui-scope.mjs" > "$RUNNER_TEMP/check-ui-scope.mjs"
          node "$RUNNER_TEMP/check-ui-scope.mjs" --base "$BASE"
